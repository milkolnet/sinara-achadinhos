<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sinara Achadinhos</title>
  <desc id="desc">Capa do projeto com uma vitrine de ofertas em tons de rosa e laranja.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b7f"/>
      <stop offset="1" stop-color="#ff8a3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6f1738" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="#fff8fa"/>
  <rect x="30" y="30" width="1140" height="570" rx="38" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="210" fill="#fff" opacity=".09"/>
  <circle cx="175" cy="565" r="250" fill="#fff" opacity=".07"/>

  <g transform="translate(78 82)">
    <rect width="70" height="70" rx="22" fill="#fff" transform="rotate(8 35 35)"/>
    <text x="35" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#ff3b7f">S</text>
    <text x="92" y="29" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">SINARA</text>
    <text x="92" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">ACHADINHOS</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#fff">
    <text x="78" y="250" font-size="58" font-weight="900">OFERTAS QUE</text>
    <text x="78" y="315" font-size="58" font-weight="900">VALEM O CLIQUE.</text>
    <text x="80" y="360" font-size="22" font-weight="600" opacity=".92">Vitrine full stack para curadoria de produtos e cupons.</text>
  </g>

  <g transform="translate(78 420)" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect width="166" height="52" rx="26" fill="#fff"/>
    <text x="83" y="33" text-anchor="middle" fill="#2d1b22">React + TypeScript</text>
    <rect x="178" width="128" height="52" rx="26" fill="#fff" opacity=".92"/>
    <text x="242" y="33" text-anchor="middle" fill="#2d1b22">Express API</text>
    <rect x="318" width="164" height="52" rx="26" fill="#fff" opacity=".84"/>
    <text x="400" y="33" text-anchor="middle" fill="#2d1b22">Prisma + SQL</text>
  </g>

  <g transform="translate(760 120)" filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect width="350" height="390" rx="34" fill="#fff"/>
    <rect x="24" y="24" width="302" height="192" rx="22" fill="#ffe4e6"/>
    <circle cx="175" cy="120" r="62" fill="#ff3b7f" opacity=".12"/>
    <path d="M145 145l30-62 30 62z" fill="#ff3b7f"/>
    <rect x="24" y="238" width="96" height="28" rx="14" fill="#fff0e8"/>
    <text x="72" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#d97706">DESTAQUE</text>
    <text x="24" y="303" font-size="21" font-weight="800" fill="#2d1b22">Achadinho do dia</text>
    <text x="24" y="345" font-size="34" font-weight="900" fill="#ff3b7f">R$ 24,90</text>
    <rect x="208" y="320" width="118" height="48" rx="18" fill="url(#bg)"/>
    <text x="267" y="351" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">EU QUERO!</text>
